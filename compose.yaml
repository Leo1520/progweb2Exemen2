services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taller_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - taller_network
    depends_on:
      - database

  web:
    image: nginx:alpine
    container_name: taller_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - taller_network
    depends_on:
      - app

  database:
    image: mysql:8
    container_name: taller_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_taller
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: taller_user
      MYSQL_PASSWORD: taller123
    volumes:
      - taller_mysql_data:/var/lib/mysql
    networks:
      - taller_network

networks:
  taller_network:

volumes:
  taller_mysql_data: